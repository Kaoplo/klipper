name: Build

on:
  push:
#    branches: [main]
  pull_request:
#    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Release (Arch, x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf qt6-base glib2 obs-studio

      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure
        run: |
          # Checkout's temporary Git configuration does not persist into this
          # container shell. Trust only this workspace for build-time Git calls.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_BINDIR=bin \
            -DKLIPPER_REQUIRE_GIT_METADATA=ON \
            -DKLIPPER_BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

      - name: Compile
        run: cmake --build build --parallel 2

      - name: Package application
        run: |
          cmake --install build --prefix "$PWD/build/artifact/klipper-linux-x86_64"
          cp -r assets build/artifact/klipper-linux-x86_64/assets
          cp README.md build/artifact/klipper-linux-x86_64/README.md
          pacman -Q > build/artifact/klipper-linux-x86_64/build-packages.txt
          tar -czf build/klipper-linux-x86_64.tar.gz -C build/artifact klipper-linux-x86_64

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          path: build/klipper-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
